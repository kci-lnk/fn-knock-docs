name: Deploy to Tencent EdgeOne

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  deploy:
    name: Trigger production deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger EdgeOne deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.TENCENT_EO_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "TENCENT_EO_DEPLOY_HOOK_URL is not configured" >&2
            exit 1
          fi

          curl \
            --fail-with-body \
            --retry 3 \
            --retry-all-errors \
            --silent \
            --show-error \
            --request POST \
            "$DEPLOY_HOOK_URL"
